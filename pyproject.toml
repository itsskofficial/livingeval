[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livingeval"
version = "0.2.0"
description = "Point livingeval at your codebase and it writes the eval suite: metrics, golden sets, drift and a three-valued CI gate."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Sarthak Karandikar" }]
keywords = [
    "llm",
    "agents",
    "evaluation",
    "llm-as-judge",
    "observability",
    "statistical-power",
    "distribution-shift",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

# The default install has no torch, no API client and no network dependency, so
# the whole invariant suite runs on every commit in seconds. See DECISIONS.md #10.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# --- judges and embedders over hosted APIs ---
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]

# --- local neural work: embeddings and the fine-tuned rung ---
embed = ["torch>=2.0", "transformers>=4.40"]
finetune = ["torch>=2.0", "transformers>=4.40"]
# Unsloth needs a CUDA GPU; kept out of `all` so `pip install livingeval[all]`
# does not fail on a laptop.
unsloth = ["unsloth", "trl>=0.9", "peft>=0.11"]
fireworks = ["fireworks-ai>=0.15"]

# --- the platform, local or deployed ---
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
postgres = ["psycopg2-binary>=2.9"]
aws = ["boto3>=1.34"]

# Generated suites call DeepEval for the metric implementations. Optional
# because `livingeval scan` and `livingeval init` need none of it -- only
# running the emitted suite does, and the emitted suite says so.
deepeval = ["deepeval>=1.0"]

figures = ["matplotlib>=3.7"]
yaml = ["pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "psycopg2-binary>=2.9",
]
# Everything that installs cleanly on a CPU-only machine with no GPU.
all = ["livingeval[openai,anthropic,embed,finetune,serve,postgres,aws,figures,yaml]"]

[project.urls]
Homepage = "https://github.com/itsskofficial/livingeval"
Documentation = "https://github.com/itsskofficial/livingeval#readme"
Issues = "https://github.com/itsskofficial/livingeval/issues"

[project.scripts]
livingeval = "livingeval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/livingeval"]

# The dashboard and review UI are single self-contained HTML files with no CDN
# dependency. They live under `src/livingeval/serve/static`, so `packages` above already
# carries them into the wheel - a `force-include` entry for the same path makes
# hatchling add each file twice and the build fails outright.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "reproduction: re-runs a bundled scenario against recorded expectations (slow, off by default)",
    "slow: simulation-heavy tests (off by default)",
    "api: requires a live judge API key and network access",
    "download: needs a model download from the Hugging Face hub (off by default)",
    "serve: needs the serve extra (fastapi + httpx)",
    "postgres: needs a reachable Postgres at LIVINGEVAL_TEST_POSTGRES_URL (off by default)",
    "supabase_stack: needs the local Supabase stack running (python scripts/dev.py up)",
]
addopts = "-m 'not reproduction and not api and not download and not postgres' --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.mypy]
# Deliberately unpinned. Pinning it to 3.10 while CI runs 3.12 made mypy parse
# numpy's stubs under 3.10 rules, where their `type` statements are a syntax
# error and checking stops before reaching any of this project's code.
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# The architectural invariant: nothing scenario-specific may live in the engine.
# `suites/` holds task-specific generators, judges and failure taxonomies;
# `src/livingeval/` must never import from it. Enforced in CI. See DECISIONS.md #11.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["livingeval"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Engine must not import scenario-specific suite code"
type = "forbidden"
source_modules = ["livingeval"]
forbidden_modules = ["suites"]

[[tool.importlinter.contracts]]
name = "Analysis layers stack downward only"
type = "layers"
layers = [
    "livingeval.cli",
    "livingeval.wizard",
    "livingeval.sync",
    "livingeval.drift",
    "livingeval.baseline",
    "livingeval.generate",
    "livingeval.plan",
    "livingeval.discover",
    "livingeval.serve",
    "livingeval.feedback",
    "livingeval.report",
    "livingeval.power",
    "livingeval.gate",
    "livingeval.mine",
    "livingeval.scorer",
    "livingeval.judge",
    "livingeval.sources",
    "livingeval.store",
    "livingeval.suite",
    "livingeval.embed",
    "livingeval.synthetic",
    "livingeval.trace",
    "livingeval.ollama",
    "livingeval.stats",
]

# The platform may depend on the library. The library must never depend on the
# platform - otherwise `import livingeval` starts needing fastapi, and the claim that
# the analysis core is a plain offline import is gone.
[[tool.importlinter.contracts]]
name = "Nothing outside serve/ may import the web layer"
type = "forbidden"
source_modules = [
    "livingeval.stats",
    "livingeval.trace",
    "livingeval.synthetic",
    "livingeval.embed",
    "livingeval.suite",
    "livingeval.store",
    "livingeval.judge",
    "livingeval.scorer",
    "livingeval.mine",
    "livingeval.gate",
    "livingeval.power",
    "livingeval.report",
    "livingeval.feedback",
]
forbidden_modules = ["livingeval.serve", "fastapi", "uvicorn", "starlette"]

# torch, transformers and the API clients are optional extras, resolved lazily inside
# the functions that need them.
#
# This contract covers only the modules that never reference them at all, not even
# behind a function-scope import. `mine`, `scorer`, `power` and `store` are deliberately
# absent: they reach `embed`, `scorer.finetune` and `store.postgres` from inside function
# bodies, and
# import-linter reads the import graph statically, so it cannot tell a deferred import
# from a module-scope one. Listing them here would fail on correct code, and loosening
# the contract until it passed would make it mean nothing.
#
# The property that actually matters - that `import livingeval` and a full analysis run
# never pull torch, transformers, fastapi or matplotlib into the process - is checked at
# runtime in `tests/unit/test_extras.py`, in a subprocess, by inspecting `sys.modules`.
# That is a stronger guarantee than any static rule here could give.
[[tool.importlinter.contracts]]
name = "Modules that never touch an optional dependency must keep it that way"
type = "forbidden"
source_modules = [
    "livingeval.stats",
    "livingeval.trace",
    "livingeval.synthetic",
    "livingeval.suite",
    "livingeval.judge.base",
    "livingeval.judge.rule",
    "livingeval.judge.validate",
    "livingeval.gate",
    "livingeval.report.record",
    "livingeval.report.tables",
    "livingeval.feedback",
]
forbidden_modules = ["torch", "transformers", "openai", "anthropic", "matplotlib", "psycopg2"]
